# =============================================================================
#  10-4 VAULT — Immich overrides
# =============================================================================
#  Layered on top of the OFFICIAL Immich docker-compose.yml, which 02-deploy.sh
#  downloads fresh from the Immich release page. We never fork their compose
#  file — we only override the few things we need. That way Immich upgrades
#  stay a one-line pull instead of a merge conflict.
#
#  What this changes:
#    1. Binds Immich to 127.0.0.1 ONLY. Tailscale is the only way in. Without
#       this, the official file publishes 2283 on every interface, which means
#       anyone on the client's home wifi can reach their entire photo library
#       with no password prompt at the network layer.
#    2. Sets the timezone so photo timestamps are right.
#
#  `!override` replaces the ports list instead of appending to it. Without the
#  tag, Compose merges sequences and you end up publishing BOTH 0.0.0.0:2283
#  and 127.0.0.1:2283 — silently undoing the whole point of this file.
# =============================================================================

services:
  immich-server:
    ports: !override
      - '127.0.0.1:2283:2283'
    environment:
      TZ: ${TZ:-Etc/UTC}

  immich-machine-learning:
    environment:
      TZ: ${TZ:-Etc/UTC}

  database:
    environment:
      TZ: ${TZ:-Etc/UTC}
